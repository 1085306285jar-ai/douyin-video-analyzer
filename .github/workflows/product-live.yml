name: ProductLive
on: [push]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --disable-pip-version-check pillow pyinstaller
      - run: choco install ffmpeg -y --no-progress
      - run: pyinstaller --noconfirm --clean --windowed --onedir --name "商品图转动态视频" product_live/main.py
      - shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path 'dist/商品图转动态视频/resources'
          Copy-Item 'C:\ProgramData\chocolatey\lib\ffmpeg\tools\ffmpeg\bin\ffmpeg.exe' 'dist/商品图转动态视频/resources/ffmpeg.exe'
      - uses: actions/upload-artifact@v4
        with:
          name: product-live-win64
          path: dist/商品图转动态视频
