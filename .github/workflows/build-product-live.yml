name: Build Product Live
on: [workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install pillow pyinstaller
      - run: pyinstaller --noconfirm --clean --windowed --onedir --name "商品图转动态视频" product_live/main.py
      - uses: actions/upload-artifact@v4
        with:
          name: 商品图转动态视频-win64
          path: dist/商品图转动态视频
